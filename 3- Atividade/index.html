<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <img src="Esporte_Clube_Bahia_logo.svg.png" alt="logo">
</head>
<body>

        
        <div class="input-group">
            <label for="num1">Primeiro Nota:</label>
            <input type="number" id="num1" placeholder="Ex: 10">
        </div>

        <div class="input-group">
            <label for="num2">Segundo Nota:</label>
            <input type="number" id="num2" placeholder="Ex: 5">
        </div>

         <div class="input-group">
            <label for="num3">Terceiro Nota:</label>
            <input type="number" id="num3" placeholder="Ex: 7">
        </div> 

          <div class="container">
            <button id="btnCalcular">
                <span class="numero-camisa">10</span>
                <span class="texto-botao">CALCULAR</span>
            </button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
