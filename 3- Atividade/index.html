<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média do Esquadrão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <img src="Esporte_Clube_Bahia_logo.svg.png" alt="logo" class="logo">
        <h1>Média do Aluno</h1>

        <div class="input-group">
            <label for="num1">Primeira Nota:</label>
            <input type="number" id="num1" placeholder="Ex: 10">
        </div>

        <div class="input-group">
            <label for="num2">Segunda Nota:</label>
            <input type="number" id="num2" placeholder="Ex: 5">
        </div>

        <div class="input-group">
            <label for="num3">Terceira Nota:</label>
            <input type="number" id="num3" placeholder="Ex: 7">
        </div> 

        <button id="btnCalcular">
            <span class="texto-botao">GOL!</span>
        </button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
