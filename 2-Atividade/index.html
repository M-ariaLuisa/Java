<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Hello Kitty</title>
    <link rel="stylesheet" href="style.css">
    <img src="external-digital-ocean-a-cloud-infrastructure-with-data-centers-worldwide-logo-fresh-tal-revivo.jpg" alt="logo">
</head>
<body>

    <div class="container">
        <h1>Média dos alunos</h1>
        
        <div class="input-group">
            <label for="num1">Primeiro Número:</label>
            <input type="number" id="num1" placeholder="Ex: 10">
        </div>

        <div class="input-group">
            <label for="num2">Segundo Número:</label>
            <input type="number" id="num2" placeholder="Ex: 5">
        </div>

        <button id="btnCalcular">Calcular média</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
